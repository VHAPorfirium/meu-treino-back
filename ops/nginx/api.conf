# Modelo de configuração do Nginx na VPS para a API do Meu Treino
# Substitua api.seudominio.com pelo domínio ou subdomínio configurado para o backend.

server {
    listen 80;
    server_name api.seudominio.com;

    # Redireciona HTTP para HTTPS (após gerar certificado com Certbot)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Repasse de cabeçalhos de host e IP real
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte a WebSocket / keepalive
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts razoáveis para uploads e requisições normais
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Tamanho máximo de payload (ex: fotos de progresso)
        client_max_body_size 15M;
    }
}
