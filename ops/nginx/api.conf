# Modelo de configuração do Nginx na VPS para a API do Meu Treino
# Substitua api.seudominio.com pelo domínio ou subdomínio configurado para o backend.

# Só envia "Connection: upgrade" quando o cliente realmente pedir Upgrade (ex.: WebSocket);
# em requisições HTTP/1.1 normais envia "Connection: close" ou mantém keepalive limpo.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name api.seudominio.com;

    # Redireciona HTTP para HTTPS (após gerar certificado com Certbot)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Repasse de cabeçalhos de host e IP real
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte condicional a Upgrade / keepalive
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts razoáveis para requisições normais
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Payloads JSON da API (fotos vão direto para o Supabase via URL assinada)
        client_max_body_size 2M;
    }
}
