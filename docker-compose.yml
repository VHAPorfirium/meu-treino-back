services:
  db:
    image: postgres:16-alpine
    container_name: meu-treino-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: treino
      POSTGRES_PASSWORD: treino
      POSTGRES_DB: meu_treino
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treino -d meu_treino"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: meu-treino-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://treino:treino@db:5432/meu_treino?schema=public
      DIRECT_URL: postgresql://treino:treino@db:5432/meu_treino?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-troque-em-producao}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      # local via http -> false; produção via https -> true
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # local: 1 proxy (nenhum, na prática) — em produção via Vercel: 2
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # push/fotos (E6) — opcionais em dev
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:dev@example.com}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_PROGRESS_BUCKET: ${SUPABASE_PROGRESS_BUCKET:-progress}
    ports:
      - "3000:3000"
    # logs em JSON (1 evento por linha) — é o que o Alloy coleta (Frente B)
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ────────────────────────────────────────────────────────────────────────────
  # Frente B — observabilidade / mini-SIEM (perfil opcional)
  #   docker compose --profile observability up -d
  # Grafana: http://localhost:3002 (admin / admin)  ·  Loki: :3100  ·  Alloy UI: :12345
  # ────────────────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.3.2
    container_name: meu-treino-loki
    profiles: ["observability"]
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./ops/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  alloy:
    image: grafana/alloy:v1.6.1
    container_name: meu-treino-alloy
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - loki
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./ops/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # descobre containers e lê o stdout deles (SÓ em dev — nunca em produção)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "12345:12345"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: meu-treino-grafana
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: "3000"
      # webhook do Discord pro alerta de brute-force (B3) — vem do .env, nunca commitado
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3002:3000"

volumes:
  pgdata:
  loki-data:
  alloy-data:
  grafana-data:
