# Deploy automático do back: a cada push na main, testa e, se passar,
# entra na VPS por SSH e roda ops/deploy-vps.sh (backup → build → migrations → health check).
#
# Segredos necessários (GitHub → Settings → Secrets and variables → Actions):
#   VPS_HOST      IP ou domínio da VPS
#   VPS_USER      usuário SSH (precisa estar no grupo "docker")
#   VPS_SSH_KEY   chave PRIVADA que entra na VPS (a pública fica no authorized_keys de lá)
#   VPS_APP_DIR   pasta do repositório na VPS (ex.: /home/deploy/meu-treino-back)
#   VPS_PORT      opcional — porta SSH, se não for 22
name: Testar e publicar em produção

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # botão "Run workflow" para publicar manualmente

jobs:
  testar:
    name: Testes, migrations e compilação
    runs-on: ubuntu-latest
    concurrency:
      group: testar-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: treino
          POSTGRES_PASSWORD: treino_ci_password
          POSTGRES_DB: meu_treino_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U treino -d meu_treino_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://treino:treino_ci_password@localhost:5432/meu_treino_ci?schema=public
      DIRECT_URL: postgresql://treino:treino_ci_password@localhost:5432/meu_treino_ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Validar schema e gerar Prisma Client
        run: |
          npx prisma validate
          npx prisma generate
      - name: Validar migrations do zero, idempotência e zero drift (Postgres 16)
        run: |
          npx prisma migrate deploy
          npx prisma migrate deploy
          npx prisma migrate status
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Smoke check do schema no PostgreSQL
        run: npm run db:smoke
      - name: Compilar (TypeScript + Nest)
        run: |
          npx tsc --noEmit -p tsconfig.json
          npm run build
      - name: Testes unitários
        run: npm test -- --ci

  publicar:
    name: Publicar na VPS
    needs: testar # só publica se os testes passarem
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    # dois pushes seguidos não fazem dois deploys ao mesmo tempo: o segundo espera o primeiro
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    steps:
      - name: Rodar o deploy na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          script: |
            cd "${{ secrets.VPS_APP_DIR }}"
            bash ops/deploy-vps.sh
