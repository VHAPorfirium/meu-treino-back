# Deploy automático do back: a cada push na main, testa e, se passar,
# entra na VPS por SSH e roda ops/deploy-vps.sh (backup → build → migrations → health check).
#
# Segredos necessários (GitHub → Settings → Secrets and variables → Actions):
#   VPS_HOST      IP ou domínio da VPS
#   VPS_USER      usuário SSH (precisa estar no grupo "docker")
#   VPS_SSH_KEY   chave PRIVADA que entra na VPS (a pública fica no authorized_keys de lá)
#   VPS_APP_DIR   pasta do repositório na VPS (ex.: /home/deploy/meu-treino-back)
#   VPS_PORT      opcional — porta SSH, se não for 22
name: Testar e publicar em produção

on:
  push:
    branches: [main]
  workflow_dispatch: # botão "Run workflow" para publicar manualmente

# dois pushes seguidos não fazem dois deploys ao mesmo tempo: o segundo espera o primeiro
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  testar:
    name: Testes e compilação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - name: Compilar (TypeScript)
        run: npx tsc --noEmit -p tsconfig.json
      - name: Testes
        run: npm test -- --ci

  publicar:
    name: Publicar na VPS
    needs: testar # só publica se os testes passarem
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Rodar o deploy na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          script: |
            cd "${{ secrets.VPS_APP_DIR }}"
            bash ops/deploy-vps.sh
