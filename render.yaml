# Render Blueprint — backend NestJS (Docker).
# Segredos NÃO ficam aqui: entram no dashboard (sync: false).
services:
  - type: web
    name: meu-treino-back
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: ohio
    branch: main # o deploy sai de `main`; trabalha-se na `dev` e faz-se merge
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGIN
        sync: false
